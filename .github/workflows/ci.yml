name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deploy on main mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT_ID: fin-analytics-api
  GCP_REGION: europe-west4
  SERVICE: fin-analytics-api
  RUNTIME_SA: fin-api-run@fin-analytics-api.iam.gserviceaccount.com
  DEPLOYER_SA: github-deployer@fin-analytics-api.iam.gserviceaccount.com
  WIF_PROVIDER: projects/1089997989086/locations/global/workloadIdentityPools/github/providers/fin-analytics-api

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format github

      - name: Test
        run: pytest -v

  deploy:
    name: Deploy to Cloud Run
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token -> Workload Identity Federation (no stored GCP key)
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # Env vars, concurrency and max-instances carry over from the previous revision.
      - name: Deploy
        run: >
          gcloud run deploy "$SERVICE"
          --source .
          --region "$GCP_REGION"
          --project "$GCP_PROJECT_ID"
          --service-account "$RUNTIME_SA"
          --quiet
