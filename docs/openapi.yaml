    PricePoint:
      properties:
        trade_date:
          type: string
          format: date
          title: Trade Date
        open:
          anyOf:
          - type: number
          - type: 'null'
          title: Open
        high:
          anyOf:
          - type: number
          - type: 'null'
          title: High
        low:
          anyOf:
          - type: number
          - type: 'null'
          title: Low
        close:
          anyOf:
          - type: number
          - type: 'null'
          title: Close
        volume:
          anyOf:
          - type: number
          - type: 'null'
          title: Volume
      type: object
      required:
