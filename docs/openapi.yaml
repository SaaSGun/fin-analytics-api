      title: PricePoint
    ScreenResult:
      properties:
        ticker:
          type: string
          title: Ticker
        company_name:
          type: string
          title: Company Name
        gics_sector:
          anyOf:
          - type: string
          - type: 'null'
          title: Gics Sector
        market_cap:
          anyOf:
          - type: number
          - type: 'null'
          title: Market Cap
        total_esg_risk_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Esg Risk Score
        risk_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Category
      type: object
      required:
