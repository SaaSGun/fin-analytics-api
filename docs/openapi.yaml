      title: Envelope[list[SectorExposure]]
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HoldingRow:
      properties:
        ticker:
          type: string
          title: Ticker
        company_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Company Name
        gics_sector:
          anyOf:
          - type: string
          - type: 'null'
          title: Gics Sector
        weight:
          type: number
          title: Weight
        shares:
